services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: revisa
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
      - ./database/catalogo.sql:/docker-entrypoint-initdb.d/2_catalogo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d revisa"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@banco:5432/revisa
      JWT_SECRET: ${JWT_SECRET:?defina o JWT_SECRET no .env}
      PROXIES_CONFIAVEIS: "0"
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
