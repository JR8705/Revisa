repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # v0.17.5, a mesma do CI
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (segredos no que vai ser commitado)
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false